id = "angel-o.hub-viewer"
name = "Hub Viewer"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open the Beads Hub Viewer in a herdr pane"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "viewer"
title = "hub-viewer"
placement = "split"
command = ["bash", "-c", "exec wbv --hub"]

[[actions]]
id = "open"
title = "Open Hub Viewer"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin angel-o.hub-viewer --entrypoint viewer --placement split"]

[[actions]]
id = "open-tab"
title = "Open Hub Viewer (new tab)"
contexts = ["workspace"]
# wbv --hub bypasses ambient lifecycle labeling, so label the created tab explicitly.
command = ["bash", "-c", "opened=$(\"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin angel-o.hub-viewer --entrypoint viewer --placement tab); tab=$(printf '%s' \"$opened\" | jq -r '.result.plugin_pane.pane.tab_id // empty'); [ -n \"$tab\" ] && \"${HERDR_BIN_PATH:-herdr}\" tab rename \"$tab\" \"ai board\" >/dev/null"]
